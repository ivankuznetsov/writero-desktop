name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed cmake ninja qt6-base qt6-declarative \
            qt6-svg qt6-imageformats libsecret sqlite git

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: QML lint
        shell: bash
        run: |
          shopt -s globstar
          PATH="/usr/lib/qt6/bin:$PATH" qmllint -I build qml/**/*.qml
